<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logo Studio Export</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

        body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; }
        
        .export-block { 
            flex: 1; display: flex; flex-direction: row; justify-content: space-evenly; align-items: center; padding: 10rem 2rem;
        }
        .light { background: #ffffff; }
        .dark { background: #0a0a0a; }

        /* Massive Wordmark for Pitch Decks / Assets */
        .mo-logo { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; }
        .mo-main { font-family: 'Cinzel', serif; font-size: 8rem; font-weight: 400; letter-spacing: 0.08em; line-height: 0.8; text-transform: uppercase; margin: 0; padding: 0; }
        .light .mo-main { color: #111; }
        .dark .mo-main { color: #fff; }
        .mo-gold { color: #C5A059; font-weight: 500; }
        .mo-sub { font-family: 'Montserrat', sans-serif; font-size: 2.5rem; color: #888; text-transform: uppercase; letter-spacing: 0.35em; margin: 1.5rem 0 0 0; font-weight: 500; }

        /* Monogram for Favicons / Social Media Profiles */
        .mo-favicon { font-family: 'Cinzel', serif; font-size: 10rem; font-weight: 400; letter-spacing: 0; line-height: 0.8; text-transform: uppercase; margin: 0; text-align: center;}
        .light .mo-favicon { color: #111; }
        .dark .mo-favicon { color: #fff; }
    </style>
</head>
<body>
    
    <!-- Light Mode Export -->
    <div class="export-block light">
        <div class="mo-logo">
            <span class="mo-main">Mach <span class="mo-gold">One</span></span>
            <span class="mo-sub">Air Charters, Inc.</span>
        </div>
        <div class="mo-favicon">M<span class="mo-gold">1</span></div>
    </div>

    <!-- Dark Mode Export -->
    <div class="export-block dark">
        <div class="mo-logo">
            <span class="mo-main">Mach <span class="mo-gold">One</span></span>
            <span class="mo-sub">Air Charters, Inc.</span>
        </div>
        <div class="mo-favicon">M<span class="mo-gold">1</span></div>
    </div>

</body>
</html>
